name: Update Russell 2000 List

on:
  schedule:
    # Quarterly: 10th of Feb, May, Aug, Nov (2 days before batch 1)
    - cron: '0 2 10 2,5,8,11 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Russell 2000 list
        run: python scripts/fetch_russell2000_list.py

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/russell2000.json data/metadata.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Russell 2000 list $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
