name: Update Russell 2000 Fundamentals

on:
  schedule:
    # Batch 1: 12th of Feb, May, Aug, Nov (1 week after S&P 500)
    - cron: '0 2 12 2,5,8,11 *'
    # Batch 2: 15th of Feb, May, Aug, Nov (+3 days)
    - cron: '0 2 15 2,5,8,11 *'
    # Batch 3: 18th of Feb, May, Aug, Nov (+3 days)
    - cron: '0 2 18 2,5,8,11 *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch number (1, 2, or 3)'
        required: true
        default: '1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance

      - name: Determine batch number
        id: batch
        run: |
          if [ -n "${{ github.event.inputs.batch }}" ]; then
            echo "BATCH=${{ github.event.inputs.batch }}" >> $GITHUB_ENV
          else
            DAY=$(date +%d)
            if [ "$DAY" = "12" ]; then
              echo "BATCH=1" >> $GITHUB_ENV
            elif [ "$DAY" = "15" ]; then
              echo "BATCH=2" >> $GITHUB_ENV
            elif [ "$DAY" = "18" ]; then
              echo "BATCH=3" >> $GITHUB_ENV
            else
              echo "BATCH=1" >> $GITHUB_ENV
            fi
          fi
          echo "Running batch: $BATCH"

      - name: Fetch Russell 2000 fundamentals (Batch ${{ env.BATCH }})
        run: python scripts/fetch_russell2000_fundamentals.py ${{ env.BATCH }}

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/fundamentals.json data/metadata.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Russell 2000 fundamentals batch ${{ env.BATCH }} $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
